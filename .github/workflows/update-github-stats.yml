name: Update GitHub Stats

on:
  schedule:
    - cron: '0 3 * * *'  # Daily at 3am UTC
  workflow_dispatch:       # Allow manual trigger from Actions tab

permissions:
  contents: write
  actions: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch GitHub stats and write JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_github_stats.py

      - name: Commit updated stats
        env:
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
        run: |
          git config user.name "Waleed2660"
          git config user.email "$GIT_EMAIL"
          git add public/github-stats.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore: update github stats"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Trigger deploy
        if: env.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
